name: NPM Publish
permissions: read-all
# TODO(#122): remove the push trigger below once trusted publishing has been
# verified working on this branch; only the `release` trigger should remain.
on:
  release:
    types: [published]
  push:
    branches: ["jaymirecki/122-fix-publish"]
jobs:
  npm-publish:
    runs-on: ubuntu-latest
    name: Publish Package
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci --include=dev
      - run: npm run build
      - run: npm publish --provenance --access public
